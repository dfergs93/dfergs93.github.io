name: Deploy to GitHub Pages

on:
  push:
    # `rebuild` is for the stage 1 launch only: GitHub dispatches a workflow only from
    # the default branch, so the first deploy comes from a push (or a re-run of one).
    # The github-pages environment's branch rule holds the deploy job until launch.
    # Remove `rebuild` once main has been fast-forwarded to it.
    branches: [main, rebuild]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_COUNT_URL: https://radref.dferguson93.workers.dev/count
      - run: npm run check:dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
